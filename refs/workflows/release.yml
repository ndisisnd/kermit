name: Release

# Tier 1 release: you pick when and how big. Manual dispatch → bump version,
# publish to npm, push the tag, and cut a GitHub Release whose notes are every
# CHANGELOG entry since the last release (kermit numbers entries per-commit and
# stamps a `## vX.Y.Z` marker at each release, so "since last release" = every
# entry above the most recent marker).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for this release
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false   # never interrupt a publish/tag push mid-flight

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version-bump commit + tag, create the Release
      id-token: write   # npm provenance (supply-chain attestation)
    steps:
      - name: Checkout (full history so tags resolve)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Extract notes FIRST — before inserting this release's marker, or the
      # extractor would stop at the marker we just added and produce empty notes.
      # Print from the first `## ` heading in the entry area down to the first
      # `## v` marker. If the entry area opens with a marker (a release with no
      # new commits), output is empty and the guard below refuses the release.
      - name: Extract release notes (entries since last version marker)
        run: awk '/^## v/{exit} /^## /{f=1} f{print}' CHANGELOG.md > RELEASE_NOTES.md

      - name: Guard — refuse an empty release
        run: test -s RELEASE_NOTES.md || { echo "no unreleased entries in CHANGELOG.md"; exit 1; }

      - name: Bump version (no auto-commit — we bundle the changelog marker in)
        id: bump
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Insert the `## vX.Y.Z — <date>` marker above the newest `## [N]` entry so
      # the next release knows where this one's commits end.
      - name: Insert version marker into CHANGELOG
        run: |
          VER="v${{ steps.bump.outputs.version }}"
          DATE="$(date +%F)"
          awk -v ver="$VER" -v date="$DATE" '
            !done && /^## \[/ { print "## " ver " — " date "\n"; done=1 }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit bump + marker, then tag
        run: |
          git add package.json CHANGELOG.md
          [ -f package-lock.json ] && git add package-lock.json || true
          git commit -m "🔖 chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit + tag to main
        run: git push --follow-tags origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          body_path: RELEASE_NOTES.md
