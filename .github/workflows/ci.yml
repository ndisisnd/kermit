name: CI

# Lightweight gate: kermit has no test suite, so we lint the installer and make
# sure the package can't ship a broken skill (dangling ref pointers, missing
# files listed in package.json).
on:
  pull_request:
  push:
    branches: [main]
    # Only run when files the checks actually inspect change — skip doc-only
    # commits (CHANGELOG.md, README.md) that CI has nothing to validate.
    paths:
      - 'install.sh'
      - 'package.json'
      - 'bin/**'
      - 'skills/**'
      - '.github/workflows/**'

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the bash installer
        run: shellcheck install.sh

      - name: Every file in package.json "files" must exist
        run: |
          node -e '
            const p = require("./package.json"), fs = require("fs");
            let bad = 0;
            for (const f of p.files) {
              if (!fs.existsSync(f)) { console.error("missing published path: " + f); bad = 1; }
            }
            process.exit(bad);
          '

      - name: Every refs/ pointer in SKILL.md must resolve
        # SKILL.md's ref pointers are relative to the skill dir, which is what ships —
        # so resolve them from there, not from the repo root. The list is derived from
        # SKILL.md itself, so any new ref (e.g. refs/protocol-subagent.md) is covered
        # automatically the moment SKILL.md points at it — no edit needed here.
        run: |
          cd skills/kermit
          missing=0
          for r in $(grep -oE 'refs/[A-Za-z0-9._-]+\.md' SKILL.md | sort -u); do
            if [ ! -f "$r" ]; then echo "dangling ref in SKILL.md: $r"; missing=1; fi
          done
          exit $missing

      - name: install.sh REFS array must match the refs/ dir
        # A curl-piped install can't list the repo, so a ref missing from the array
        # ships a broken skill. Compare the array against what's actually on disk.
        run: |
          on_disk=$(ls skills/kermit/refs | sort)
          in_array=$(grep -oE '^REFS=\(.*\)' install.sh | grep -oE '[A-Za-z0-9._-]+\.md' | sort)
          if ! diff <(echo "$on_disk") <(echo "$in_array"); then
            echo "install.sh REFS array is out of sync with skills/kermit/refs/"
            exit 1
          fi

      - name: Codex adapter files must exist and match install.sh AGENTS_FILES
        # Same failure mode as REFS: a curl-piped install can't list the repo, so a
        # Codex adapter file missing from the array (or from disk) ships a broken
        # Codex install. Both files are required — openai.yaml is the skill
        # declaration Codex reads, kermit-agent.toml is the subagent role.
        run: |
          missing=0
          for f in skills/kermit/agents/openai.yaml skills/kermit/agents/kermit-agent.toml; do
            if [ ! -f "$f" ]; then echo "missing Codex adapter file: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          on_disk=$(ls skills/kermit/agents | sort)
          in_array=$(grep -oE '^AGENTS_FILES=\(.*\)' install.sh | grep -oE '[A-Za-z0-9._-]+\.(yaml|yml|toml)' | sort)
          if ! diff <(echo "$on_disk") <(echo "$in_array"); then
            echo "install.sh AGENTS_FILES array is out of sync with skills/kermit/agents/"
            exit 1
          fi
